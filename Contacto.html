        <nav class="container">
            <a class="navbar-brand" href="index.html#inicio"><img src="Imagenes/Logo.jpg" alt="Logo" class="logotipo"> Mi portafolio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="menu">

    <main class="container py-5 contenido-contacto">
        <h1 class="text-success text-center mb-4">Contacto</h1>
        
<div class="row">

    <!-- Formulario -->
    <section class="col-lg-6 mb-4">
        <h2 class="h4">Contáctame</h2>

        <form>
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" id="nombre" class="form-control mb-3" placeholder="Tu nombre" required>

            <label for="correo" class="form-label">Correo electrónico</label>
            <input type="email" id="correo" class="form-control mb-3" placeholder="Tu correo" required>

            <label for="mensaje" class="form-label">Mensaje</label>
            <textarea id="mensaje" class="form-control mb-3" rows="5" placeholder="Escribe tu mensaje" required></textarea>

            <p class="text-muted small">Este formulario es de ejemplo y todavía no envía mensajes.</p>

            <button type="button" class="btn btn-success" disabled>
                Enviar (demostración)
            </button>
        </form>
    </section>

    <!-- Mapa de ubicación -->
    <section class="col-lg-6 mb-4">
        <h2 class="h4 text-center mb-3">Ubicación</h2>

        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3723.2262963302396!2d-101.58421835969527!3d21.063622086659805!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x842b963652f40f0d%3A0xa7d88da0ad8eff8a!2sUniversidad%20Tecnol%C3%B3gica%20de%20Le%C3%B3n!5e0!3m2!1ses-419!2smx!4v1793031488146!5m2!1ses-419!2smx"
            width="100%"
            height="450"
            style="border:0;"
            allowfullscreen=""
            loading="lazy">
        </iframe>
    </section>

</div>
